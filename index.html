<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PulsePal Configurator</title>

  <meta name="description" content="PulsePal staff tool for installing tracking devices">
  <meta name="theme-color" content="#FFFFFF">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Configurator">

  <!-- Styles -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">

  <!-- Theme: runs before the body paints so there is no white flash -->
  <script src="js/theme.js"></script>
</head>
<body>

  <div id="app">

    <!-- Top bar: back arrow | page title | staff badge -->
    <header class="topbar" id="topbar">
      <button class="topbar__back" id="backBtn" type="button" aria-label="Go back" hidden>
        <span data-icon="arrowLeft"></span>
      </button>
      <h1 class="topbar__title" id="pageTitle">PulsePal</h1>
      <span class="staff-badge" id="staffBadge" hidden></span>
    </header>

    <!-- Pages (.frag files) load in here -->
    <main id="view" aria-live="polite"></main>

    <!-- Bottom navigation -->
    <nav class="bottom-nav" aria-label="Main">
      <a class="bottom-nav__item" href="#/home" data-nav="home">
        <span data-icon="home"></span>
        <span>Home</span>
      </a>
      <a class="bottom-nav__item" href="#/installations" data-nav="installations">
        <span data-icon="list"></span>
        <span>Installs</span>
      </a>
      <a class="bottom-nav__item" href="#/tools" data-nav="tools">
        <span data-icon="tools"></span>
        <span>Tools</span>
      </a>
      <a class="bottom-nav__item" href="#/settings" data-nav="settings">
        <span data-icon="settings"></span>
        <span>Settings</span>
      </a>
    </nav>

  </div>

  <!-- Scripts: order matters (data -> router -> app, which starts the router) -->
  <script src="js/dummy-data.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
